[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "avac4qgis-validation"
version = "0.1.0"
description = "Reproducibility tools for the AVAC4QGIS validation notebooks"
requires-python = ">=3.10"
dependencies = [
  "ipython>=8",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "PyYAML>=6",
  "pyshp>=2.3",
  "rasterio>=1.3",
  "scipy>=1.10",
]

[tool.setuptools]
packages = ["avac4qgis_validation"]
